[pytest]
pythonpath = .
testpaths = tests
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=bfl
    --cov=ui_api
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=90
markers =
    unit: Unit tests for individual functions/modules
    integration: Integration tests that exercise multiple components
    slow: Tests that take a long time to run
    api: Tests that require the FastAPI server
    ui: Tests that require the React frontend
